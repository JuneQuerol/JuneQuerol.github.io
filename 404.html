<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page not found - June Vergel Querol">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>404: Page Not Found - June Vergel Querol</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #111827;
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      text-align: center;
    }
    .container {
      max-width: 32rem;
      padding: 2.5rem 2rem;
      background: rgba(31, 41, 55, 0.6);
      border: 1px solid #374151;
      border-radius: 1rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: #93c5fd;
      background-color: rgba(30, 58, 138, 0.4);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 9999px;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 3.5rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      background: linear-gradient(to right, #60a5fa, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    h2 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #e5e7eb;
      margin-bottom: 1rem;
    }
    p {
      color: #9ca3af;
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 2rem;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 500;
      text-decoration: none;
      border-radius: 9999px;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(to right, #2563eb, #7c3aed);
      color: #ffffff;
      box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.4);
    }
    .btn-primary:hover {
      background: linear-gradient(to right, #1d4ed8, #6d28d9);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: #374151;
      color: #e5e7eb;
      border: 1px solid #4b5563;
    }
    .btn-secondary:hover {
      background: #4b5563;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">404 Error</div>
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page or resource you are looking for has been moved, removed, or never existed.</p>
    <div class="links">
      <a href="/" class="btn btn-primary">
        <span>🏠</span> Return Home
      </a>
      <a href="/articles" class="btn btn-secondary">
        <span>📚</span> Browse Articles
      </a>
    </div>
  </div>
</body>
</html>
