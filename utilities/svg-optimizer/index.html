-1.5 sm:py-2 rounded-full text-sm sm:text-base font-medium transition-all duration-200 shadow-md hover:shadow-lg whitespace-nowrap" data-astro-cid-5blmo7yk> <span data-astro-cid-5blmo7yk>📝</span> <span class="hidden md:inline" data-astro-cid-5blmo7yk>Daily Journal</span> <span class="hidden sm:inline md:hidden" data-astro-cid-5blmo7yk>Journal</span> </a> <a href="/thoughts" class="inline-flex items-center gap-1 sm:gap-2 bg-gradient-to-r from-violet-600 to-pink-600 hover:from-violet-700 hover:to-pink-700 text-white px-2 sm:px-4 py-1.5 sm:py-2 rounded-full text-sm sm:text-base font-medium transition-all duration-200 shadow-md hover:shadow-lg whitespace-nowrap" data-astro-cid-5blmo7yk> <span data-astro-cid-5blmo7yk>💭</span> <span class="hidden sm:inline" data-astro-cid-5blmo7yk>Thoughts</span> </a> </div> </div> </div> </div>   <div class="container mx-auto px-5 py-12"> <div class="max-w-5xl mx-auto"> <!-- Header --> <div class="mb-8"> <a href="/utilities" class="inline-flex items-center text-blue-400 hover:underline mb-4">← Back to All Utilities</a> <div class="flex items-center gap-4 mb-3"> <span class="text-5xl">🎯</span> <h1 class="text-4xl font-bold">SVG Optimizer</h1> </div> <p class="text-lg text-gray-300">Clean, minify, and strip metadata from SVG code to reduce file size</p> </div> <!-- Content Slot --> <div class="bg-gray-800 rounded-xl p-6 md:p-8 shadow-lg border border-gray-700 space-y-6"> <!-- Options --> <div class="grid grid-cols-2 md:grid-cols-4 gap-4 p-4 bg-gray-900 rounded-lg border border-gray-700"> <label class="inline-flex items-center gap-2 cursor-pointer text-sm"> <input type="checkbox" id="stripComments" checked class="w-4 h-4 rounded text-blue-600"> <span>Remove comments</span> </label> <label class="inline-flex items-center gap-2 cursor-pointer text-sm"> <input type="checkbox" id="stripMetadata" checked class="w-4 h-4 rounded text-blue-600"> <span>Remove &lt;metadata&gt;</span> </label> <label class="inline-flex items-center gap-2 cursor-pointer text-sm"> <input type="checkbox" id="stripXml" checked class="w-4 h-4 rounded text-blue-600"> <span>Remove XML/Doctype</span> </label> <label class="inline-flex items-center gap-2 cursor-pointer text-sm"> <input type="checkbox" id="collapseSpaces" checked class="w-4 h-4 rounded text-blue-600"> <span>Collapse whitespace</span> </label> </div> <!-- Inputs & Previews Grid --> <div class="grid grid-cols-1 lg:grid-cols-2 gap-6"> <div> <label class="block text-sm font-medium mb-2">Input SVG Code:</label> <textarea id="svgInput" rows="10" placeholder="Paste your SVG code here..." class="w-full p-4 border-2 border-gray-600 rounded-lg bg-gray-900 text-white font-mono text-sm focus:ring-2 focus:ring-blue-500"><svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Circle icon -->
  <circle cx="50" cy="50" r="40" stroke="#3b82f6" stroke-width="4" fill="#1e40af" />
  <path d="M30 50 L45 65 L70 35" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg></textarea> </div> <div> <label class="block text-sm font-medium mb-2">Live Preview:</label> <div id="previewBox" class="w-full h-60 border-2 border-gray-600 rounded-lg bg-gray-900 flex items-center justify-center p-4 overflow-hidden"></div> </div> </div> <!-- Stats Bar --> <div class="p-4 bg-gray-900 rounded-lg border border-gray-700 flex flex-wrap justify-between items-center text-sm font-mono gap-4"> <div>Original: <span id="origSize" class="text-gray-300 font-bold">0 B</span></div> <div>Optimized: <span id="optSize" class="text-green-400 font-bold">0 B</span></div> <div>Savings: <span id="savingsPct" class="text-blue-400 font-bold">0%</span></div> </div> <!-- Action Buttons --> <div class="flex flex-wrap gap-3"> <button id="optimizeBtn" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors">Optimize SVG</button> <button id="copyBtn" class="px-6 py-3 bg-green-600 hover:bg-green-700 text-white rounded-lg font-medium transition-colors">Copy Optimized Code</button> <button id="downloadBtn" class="px-6 py-3 bg-purple-600 hover:bg-purple-700 text-white rounded-lg font-medium transition-colors">Download .svg</button> <button id="clearBtn" class="px-6 py-3 bg-red-600 hover:bg-red-700 text-white rounded-lg font-medium transition-colors">Clear</button> </div> <!-- Status --> <div id="status" class="hidden p-4 rounded-lg"></div> <!-- Output --> <div> <label class="block text-sm font-medium mb-2">Optimized SVG Code:</label> <textarea id="svgOutput" rows="8" readonly class="w-full p-4 border-2 border-gray-600 rounded-lg bg-gray-900 text-white font-mono text-sm focus:ring-2 focus:ring-blue-500"></textarea> </div> </div> <script type="module">
document.addEventListener("DOMContentLoaded", () => {
  const svgInput = document.getElementById("svgInput");
  const svgOutput = document.getElementById("svgOutput");
  const previewBox = document.getElementById("previewBox");
  const origSize = document.getElementById("origSize");
  const optSize = document.getElementById("optSize");
  const savingsPct = document.getElementById("savingsPct");

  const stripComments = document.getElementById("stripComments");
  const stripMetadata = document.getElementById("stripMetadata");
  const stripXml = document.getElementById("stripXml");
  const collapseSpaces = document.getElementById("collapseSpaces");

  const optimizeBtn = document.getElementById("optimizeBtn");
  const copyBtn = document.getElementById("copyBtn");
  const downloadBtn = document.getElementById("downloadBtn");
  const clearBtn = document.getElementById("clearBtn");
  const status = document.getElementById("status");

  const showStatus = (msg, type = "success") => {
    status.textContent = msg;
    status.className = `p-4 rounded-lg ${type === "success" ? "bg-green-900/30 text-green-200 border border-green-700" : "bg-red-900/30 text-red-200 border border-red-700"}`;
    status.classList.remove("hidden");
    setTimeout(() => status.classList.add("hidden"), 3000);
  };

  const optimize = () => {
    let raw = svgInput.value.trim();
    if (!raw) {
      svgOutput.value = "";
      previewBox.innerHTML = "<span class='text-gray-500'>No SVG preview</span>";
      origSize.textContent = "0 B";
      optSize.textContent = "0 B";
      savingsPct.textContent = "0%";
      return;
    }

    const originalBytes = new Blob([raw]).size;
    let res = raw;

    if (stripXml.checked) {
      res = res.replace(/<\?xml[^>]*\?>/gi, "");
      res = res.replace(/<!DOCTYPE[^>]*>/gi, "");
    }
    if (stripComments.checked) {
      res = res.replace(/<!--[\s\S]*?-->/g, "");
    }
    if (stripMetadata.checked) {
      res = res.replace(/<metadata[\s\S]*?<\/metadata>/gi, "");
    }
    if (collapseSpaces.checked) {
      res = res.replace(/>\s+</g, "><");
      res = res.replace(/\s{2,}/g, " ");
    }
    res = res.trim();

    svgOutput.value = res;
    previewBox.innerHTML = res;

    const optBytes = new Blob([res]).size;
    origSize.textContent = originalBytes + " B";
    optSize.textContent = optBytes + " B";
    const saved = Math.max(0, originalBytes - optBytes);
    const pct = originalBytes > 0 ? ((saved / originalBytes) * 100).toFixed(1) : 0;
    savingsPct.textContent = pct + "% (" + saved + " B saved)";

    showStatus("✓ SVG optimized successfully!", "success");
  };

  optimizeBtn.addEventListener("click", optimize);
  copyBtn.addEventListener("click", async () => {
    if (!svgOutput.value) return;
    await navigator.clipboard.writeText(svgOutput.value);
    showStatus("✓ Optimized SVG copied to clipboard!", "success");
  });
  downloadBtn.addEventListener("click", () => {
    if (!svgOutput.value) return;
    const blob = new Blob([svgOutput.value], { type: "image/svg+xml" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "optimized.svg";
    a.click();
    URL.revokeObjectURL(url);
  });
  clearBtn.addEventListener("click", () => {
    svgInput.value = "";
    optimize();
  });

  optimize();
});
</script>  <!-- Back to utilities --> <div class="mt-8 text-center"> <a href="/utilities" class="inline-flex items-center gap-2 px-6 py-3 bg-gray-700 hover:bg-gray-600 rounded-lg transition-colors">← Browse More Utilities</a> </div> </div> </div>  </main> </body></html>
