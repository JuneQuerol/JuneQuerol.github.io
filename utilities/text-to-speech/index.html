y-1.5 sm:py-2 rounded-full text-sm sm:text-base font-medium transition-all duration-200 shadow-md hover:shadow-lg whitespace-nowrap" data-astro-cid-5blmo7yk> <span data-astro-cid-5blmo7yk>📝</span> <span class="hidden md:inline" data-astro-cid-5blmo7yk>Daily Journal</span> <span class="hidden sm:inline md:hidden" data-astro-cid-5blmo7yk>Journal</span> </a> <a href="/thoughts" class="inline-flex items-center gap-1 sm:gap-2 bg-gradient-to-r from-violet-600 to-pink-600 hover:from-violet-700 hover:to-pink-700 text-white px-2 sm:px-4 py-1.5 sm:py-2 rounded-full text-sm sm:text-base font-medium transition-all duration-200 shadow-md hover:shadow-lg whitespace-nowrap" data-astro-cid-5blmo7yk> <span data-astro-cid-5blmo7yk>💭</span> <span class="hidden sm:inline" data-astro-cid-5blmo7yk>Thoughts</span> </a> </div> </div> </div> </div>   <div class="container mx-auto px-5 py-12"> <div class="max-w-5xl mx-auto"> <!-- Header --> <div class="mb-8"> <a href="/utilities" class="inline-flex items-center text-blue-400 hover:underline mb-4">← Back to All Utilities</a> <div class="flex items-center gap-4 mb-3"> <span class="text-5xl">🔊</span> <h1 class="text-4xl font-bold">Text to Speech</h1> </div> <p class="text-lg text-gray-300">Convert written text into natural spoken audio directly in your browser</p> </div> <!-- Content Slot --> <div class="bg-gray-800 rounded-xl p-6 md:p-8 shadow-lg border border-gray-700">  <div class="space-y-6"> <!-- Textarea --> <div> <label class="block text-sm font-medium mb-2">Enter text to speak:</label> <textarea id="textInput" rows="7" placeholder="Type or paste text here to hear it read aloud..." class="w-full p-4 border-2 border-gray-600 rounded-lg bg-gray-900 text-white text-base focus:ring-2 focus:ring-blue-500">Welcome to June Vergel Querol's technology portfolio. This browser tool converts written text directly into speech with customizable pitch, speed, and voice controls.</textarea> </div> <!-- Controls Grid --> <div class="grid grid-cols-1 md:grid-cols-3 gap-6"> <div> <label class="block text-sm font-medium mb-2">Select Voice:</label> <select id="voiceSelect" class="w-full p-3 border-2 border-gray-600 rounded-lg bg-gray-900 text-white focus:ring-2 focus:ring-blue-500"> <option>Loading voices...</option> </select> </div> <div> <label class="block text-sm font-medium mb-2">Speed (Rate): <span id="rateVal" class="text-blue-400">1.0x</span></label> <input type="range" id="rate" min="0.5" max="2" value="1" step="0.1" class="w-full accent-blue-600"> </div> <div> <label class="block text-sm font-medium mb-2">Pitch: <span id="pitchVal" class="text-blue-400">1.0</span></label> <input type="range" id="pitch" min="0.5" max="1.5" value="1" step="0.1" class="w-full accent-blue-600"> </div> </div> <!-- Action Buttons --> <div class="flex flex-wrap gap-3"> <button id="playBtn" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors flex items-center gap-2"><span>▶</span> Play Speech</button> <button id="pauseBtn" class="px-6 py-3 bg-yellow-600 hover:bg-yellow-700 text-white rounded-lg font-medium transition-colors">Pause</button> <button id="resumeBtn" class="px-6 py-3 bg-green-600 hover:bg-green-700 text-white rounded-lg font-medium transition-colors">Resume</button> <button id="stopBtn" class="px-6 py-3 bg-red-600 hover:bg-red-700 text-white rounded-lg font-medium transition-colors">Stop</button> </div> <!-- Status --> <div id="status" class="hidden p-4 rounded-lg"></div> </div> <script type="module">
document.addEventListener("DOMContentLoaded", () => {
  const textInput = document.getElementById("textInput");
  const voiceSelect = document.getElementById("voiceSelect");
  const rateInput = document.getElementById("rate");
  const rateVal = document.getElementById("rateVal");
  const pitchInput = document.getElementById("pitch");
  const pitchVal = document.getElementById("pitchVal");
  const playBtn = document.getElementById("playBtn");
  const pauseBtn = document.getElementById("pauseBtn");
  const resumeBtn = document.getElementById("resumeBtn");
  const stopBtn = document.getElementById("stopBtn");
  const status = document.getElementById("status");

  const synth = window.speechSynthesis;
  let voices = [];

  const showStatus = (msg, type = "success") => {
    status.textContent = msg;
    status.className = `p-4 rounded-lg ${type === "success" ? "bg-green-900/30 text-green-200 border border-green-700" : "bg-blue-900/30 text-blue-200 border border-blue-700"}`;
    status.classList.remove("hidden");
  };

  const populateVoiceList = () => {
    if (!synth) {
      voiceSelect.innerHTML = "<option>Speech synthesis not supported</option>";
      return;
    }
    voices = synth.getVoices();
    voiceSelect.innerHTML = "";
    voices.forEach((voice, i) => {
      const option = document.createElement("option");
      option.textContent = `${voice.name} (${voice.lang})${voice.default ? " — DEFAULT" : ""}`;
      option.value = i;
      voiceSelect.appendChild(option);
    });
  };

  populateVoiceList();
  if (synth && synth.onvoiceschanged !== undefined) {
    synth.onvoiceschanged = populateVoiceList;
  }

  rateInput.addEventListener("input", () => { rateVal.textContent = rateInput.value + "x"; });
  pitchInput.addEventListener("input", () => { pitchVal.textContent = pitchInput.value; });

  playBtn.addEventListener("click", () => {
    if (!synth) return;
    if (synth.speaking) synth.cancel();

    const text = textInput.value.trim();
    if (!text) return;

    const utter = new SpeechSynthesisUtterance(text);
    const selectedVoice = voices[voiceSelect.value];
    if (selectedVoice) utter.voice = selectedVoice;
    utter.rate = parseFloat(rateInput.value);
    utter.pitch = parseFloat(pitchInput.value);

    utter.onstart = () => showStatus("🔊 Speaking...", "info");
    utter.onend = () => showStatus("✓ Finished speaking.", "success");
    utter.onerror = (e) => showStatus("✗ Error during speech: " + e.error, "error");

    synth.speak(utter);
  });

  pauseBtn.addEventListener("click", () => {
    if (synth && synth.speaking) {
      synth.pause();
      showStatus("⏸ Speech paused.", "info");
    }
  });

  resumeBtn.addEventListener("click", () => {
    if (synth && synth.paused) {
      synth.resume();
      showStatus("🔊 Speech resumed.", "info");
    }
  });

  stopBtn.addEventListener("click", () => {
    if (synth) {
      synth.cancel();
      status.classList.add("hidden");
    }
  });
});
</script>  </div> <!-- Back to utilities --> <div class="mt-8 text-center"> <a href="/utilities" class="inline-flex items-center gap-2 px-6 py-3 bg-gray-700 hover:bg-gray-600 rounded-lg transition-colors">← Browse More Utilities</a> </div> </div> </div>  </main> </body></html>
