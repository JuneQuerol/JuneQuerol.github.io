700 text-white px-2 sm:px-4 py-1.5 sm:py-2 rounded-full text-sm sm:text-base font-medium transition-all duration-200 shadow-md hover:shadow-lg whitespace-nowrap" data-astro-cid-5blmo7yk> <span data-astro-cid-5blmo7yk>📝</span> <span class="hidden md:inline" data-astro-cid-5blmo7yk>Daily Journal</span> <span class="hidden sm:inline md:hidden" data-astro-cid-5blmo7yk>Journal</span> </a> <a href="/thoughts" class="inline-flex items-center gap-1 sm:gap-2 bg-gradient-to-r from-violet-600 to-pink-600 hover:from-violet-700 hover:to-pink-700 text-white px-2 sm:px-4 py-1.5 sm:py-2 rounded-full text-sm sm:text-base font-medium transition-all duration-200 shadow-md hover:shadow-lg whitespace-nowrap" data-astro-cid-5blmo7yk> <span data-astro-cid-5blmo7yk>💭</span> <span class="hidden sm:inline" data-astro-cid-5blmo7yk>Thoughts</span> </a> </div> </div> </div> </div>   <div class="container mx-auto px-5 py-12"> <div class="max-w-5xl mx-auto"> <!-- Header --> <div class="mb-8"> <a href="/utilities" class="inline-flex items-center text-blue-400 hover:underline mb-4">← Back to All Utilities</a> <div class="flex items-center gap-4 mb-3"> <span class="text-5xl">🆔</span> <h1 class="text-4xl font-bold">UUID Generator</h1> </div> <p class="text-lg text-gray-300">Generate RFC4122 compliant version 4 UUIDs (Universally Unique Identifiers) in bulk</p> </div> <!-- Content Slot --> <div class="bg-gray-800 rounded-xl p-6 md:p-8 shadow-lg border border-gray-700">  <div class="space-y-6"> <!-- Options --> <div class="grid grid-cols-1 md:grid-cols-3 gap-4"> <div> <label class="block text-sm font-medium mb-2">Quantity:</label> <select id="quantity" class="w-full p-3 border-2 border-gray-600 rounded-lg bg-gray-900 text-white focus:ring-2 focus:ring-blue-500"> <option value="1">1 UUID</option> <option value="5" selected>5 UUIDs</option> <option value="10">10 UUIDs</option> <option value="25">25 UUIDs</option> <option value="50">50 UUIDs</option> <option value="100">100 UUIDs</option> </select> </div> <div> <label class="block text-sm font-medium mb-2">Letter Case:</label> <select id="letterCase" class="w-full p-3 border-2 border-gray-600 rounded-lg bg-gray-900 text-white focus:ring-2 focus:ring-blue-500"> <option value="lower">lowercase (default)</option> <option value="upper">UPPERCASE</option> </select> </div> <div> <label class="block text-sm font-medium mb-2">Format:</label> <select id="format" class="w-full p-3 border-2 border-gray-600 rounded-lg bg-gray-900 text-white focus:ring-2 focus:ring-blue-500"> <option value="hyphens">With hyphens</option> <option value="nohyphens">Without hyphens</option> </select> </div> </div> <!-- Buttons --> <div class="flex flex-wrap gap-3"> <button id="generateBtn" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors">Generate UUIDs</button> <button id="copyBtn" class="px-6 py-3 bg-green-600 hover:bg-green-700 text-white rounded-lg font-medium transition-colors">Copy All</button> <button id="clearBtn" class="px-6 py-3 bg-red-600 hover:bg-red-700 text-white rounded-lg font-medium transition-colors">Clear</button> </div> <!-- Status --> <div id="status" class="hidden p-4 rounded-lg"></div> <!-- Output --> <div> <label class="block text-sm font-medium mb-2">Generated UUIDs:</label> <textarea id="output" rows="10" readonly class="w-full p-4 border-2 border-gray-600 rounded-lg bg-gray-900 text-white font-mono text-sm" placeholder="Click 'Generate UUIDs' to create UUIDs..."></textarea> </div> </div> <script type="module">
document.addEventListener("DOMContentLoaded", () => {
  const qtySelect = document.getElementById("quantity");
  const caseSelect = document.getElementById("letterCase");
  const formatSelect = document.getElementById("format");
  const generateBtn = document.getElementById("generateBtn");
  const copyBtn = document.getElementById("copyBtn");
  const clearBtn = document.getElementById("clearBtn");
  const output = document.getElementById("output");
  const status = document.getElementById("status");

  const showStatus = (msg, type = "success") => {
    status.textContent = msg;
    status.className = `p-4 rounded-lg ${type === "success" ? "bg-green-900/30 text-green-200 border border-green-700" : "bg-red-900/30 text-red-200 border border-red-700"}`;
    status.classList.remove("hidden");
    setTimeout(() => status.classList.add("hidden"), 3000);
  };

  const generateUUID = () => {
    let uuid;
    if (typeof crypto !== "undefined" && crypto.randomUUID) {
      uuid = crypto.randomUUID();
    } else {
      uuid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        const r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }
    if (formatSelect.value === "nohyphens") uuid = uuid.replace(/-/g, "");
    if (caseSelect.value === "upper") uuid = uuid.toUpperCase();
    return uuid;
  };

  const handleGenerate = () => {
    const count = parseInt(qtySelect.value, 10) || 1;
    const uuids = Array.from({ length: count }, generateUUID);
    output.value = uuids.join("\n");
    showStatus(`✓ Generated ${count} UUID(s)!`, "success");
  };

  generateBtn?.addEventListener("click", handleGenerate);
  copyBtn?.addEventListener("click", async () => {
    if (!output.value) return;
    await navigator.clipboard.writeText(output.value);
    showStatus("✓ Copied all UUIDs to clipboard!", "success");
  });
  clearBtn?.addEventListener("click", () => {
    output.value = "";
    status.classList.add("hidden");
  });

  handleGenerate();
});
</script>  </div> <!-- Back to utilities --> <div class="mt-8 text-center"> <a href="/utilities" class="inline-flex items-center gap-2 px-6 py-3 bg-gray-700 hover:bg-gray-600 rounded-lg transition-colors">← Browse More Utilities</a> </div> </div> </div>  </main> </body></html>
