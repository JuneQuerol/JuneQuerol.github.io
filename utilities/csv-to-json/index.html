py-2 rounded-full text-sm sm:text-base font-medium transition-all duration-200 shadow-md hover:shadow-lg whitespace-nowrap" data-astro-cid-5blmo7yk> <span data-astro-cid-5blmo7yk>📝</span> <span class="hidden md:inline" data-astro-cid-5blmo7yk>Daily Journal</span> <span class="hidden sm:inline md:hidden" data-astro-cid-5blmo7yk>Journal</span> </a> <a href="/thoughts" class="inline-flex items-center gap-1 sm:gap-2 bg-gradient-to-r from-violet-600 to-pink-600 hover:from-violet-700 hover:to-pink-700 text-white px-2 sm:px-4 py-1.5 sm:py-2 rounded-full text-sm sm:text-base font-medium transition-all duration-200 shadow-md hover:shadow-lg whitespace-nowrap" data-astro-cid-5blmo7yk> <span data-astro-cid-5blmo7yk>💭</span> <span class="hidden sm:inline" data-astro-cid-5blmo7yk>Thoughts</span> </a> </div> </div> </div> </div>   <div class="container mx-auto px-5 py-12"> <div class="max-w-5xl mx-auto"> <!-- Header --> <div class="mb-8"> <a href="/utilities" class="inline-flex items-center text-blue-400 hover:underline mb-4">← Back to All Utilities</a> <div class="flex items-center gap-4 mb-3"> <span class="text-5xl">📊</span> <h1 class="text-4xl font-bold">CSV to JSON</h1> </div> <p class="text-lg text-gray-300">Convert CSV, TSV, or spreadsheet tables into structured JSON arrays and objects</p> </div> <!-- Content Slot --> <div class="bg-gray-800 rounded-xl p-6 md:p-8 shadow-lg border border-gray-700">  <div class="space-y-6"> <!-- Options --> <div class="grid grid-cols-1 md:grid-cols-3 gap-4"> <div> <label class="block text-sm font-medium mb-2">Delimiter:</label> <select id="delimiter" class="w-full p-3 border-2 border-gray-600 rounded-lg bg-gray-900 text-white focus:ring-2 focus:ring-blue-500"> <option value="auto">Auto-detect</option> <option value=",">Comma (,)</option> <option value=";">Semicolon (;)</option> <option value="&#9;">Tab (\t)</option> <option value="|">Pipe (|)</option> </select> </div> <div> <label class="block text-sm font-medium mb-2">Parse Options:</label> <div class="pt-3"> <label class="inline-flex items-center gap-2 cursor-pointer"> <input type="checkbox" id="hasHeader" checked class="w-4 h-4 rounded text-blue-600 bg-gray-900 border-gray-600"> <span class="text-sm">First row is Header</span> </label> </div> </div> <div> <label class="block text-sm font-medium mb-2">Numbers / Booleans:</label> <div class="pt-3"> <label class="inline-flex items-center gap-2 cursor-pointer"> <input type="checkbox" id="parseTypes" checked class="w-4 h-4 rounded text-blue-600 bg-gray-900 border-gray-600"> <span class="text-sm">Auto-parse numbers &amp; booleans</span> </label> </div> </div> </div> <!-- Input --> <div> <label class="block text-sm font-medium mb-2">Input CSV:</label> <textarea id="csvInput" rows="8" placeholder="name,age,role&#10;Alice,29,Engineer&#10;Bob,34,Designer" class="w-full p-4 border-2 border-gray-600 rounded-lg bg-gray-900 text-white font-mono text-sm focus:ring-2 focus:ring-blue-500">name,role,experience,certified
June Vergel Querol,ICT Head & Instructor,7,true
Maria Santos,Academic Dean,12,true
Juan Dela Cruz,Software Developer,4,false</textarea> </div> <!-- Buttons --> <div class="flex flex-wrap gap-3"> <button id="convertBtn" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors">Convert to JSON</button> <button id="copyBtn" class="px-6 py-3 bg-green-600 hover:bg-green-700 text-white rounded-lg font-medium transition-colors">Copy JSON</button> <button id="downloadBtn" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium transition-colors">Download .json</button> <button id="clearBtn" class="px-6 py-3 bg-red-600 hover:bg-red-700 text-white rounded-lg font-medium transition-colors">Clear</button> </div> <!-- Status --> <div id="status" class="hidden p-4 rounded-lg"></div> <!-- Output --> <div> <label class="block text-sm font-medium mb-2">Output JSON:</label> <textarea id="jsonOutput" rows="10" readonly class="w-full p-4 border-2 border-gray-600 rounded-lg bg-gray-900 text-white font-mono text-sm focus:ring-2 focus:ring-blue-500"></textarea> </div> </div> <script type="module">
document.addEventListener("DOMContentLoaded", () => {
  const csvInput = document.getElementById("csvInput");
  const jsonOutput = document.getElementById("jsonOutput");
  const delimiterSelect = document.getElementById("delimiter");
  const hasHeaderCheckbox = document.getElementById("hasHeader");
  const parseTypesCheckbox = document.getElementById("parseTypes");
  const convertBtn = document.getElementById("convertBtn");
  const copyBtn = document.getElementById("copyBtn");
  const downloadBtn = document.getElementById("downloadBtn");
  const clearBtn = document.getElementById("clearBtn");
  const status = document.getElementById("status");

  const showStatus = (msg, type = "success") => {
    status.textContent = msg;
    status.className = `p-4 rounded-lg ${type === "success" ? "bg-green-900/30 text-green-200 border border-green-700" : "bg-red-900/30 text-red-200 border border-red-700"}`;
    status.classList.remove("hidden");
    setTimeout(() => status.classList.add("hidden"), 3000);
  };

  const parseValue = (val) => {
    if (!parseTypesCheckbox.checked) return val;
    val = val.trim();
    if (val === "true") return true;
    if (val === "false") return false;
    if (val === "null") return null;
    if (!isNaN(val) && val !== "") return Number(val);
    return val;
  };

  const parseCSVLine = (text, delim) => {
    let row = [];
    let cur = "";
    let inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      let c = text[i];
      if (c === '"') {
        if (inQuotes && text[i+1] === '"') { cur += '"'; i++; }
        else { inQuotes = !inQuotes; }
      } else if (c === delim && !inQuotes) {
        row.push(cur);
        cur = "";
      } else {
        cur += c;
      }
    }
    row.push(cur);
    return row;
  };

  const convert = () => {
    const text = csvInput.value.trim();
    if (!text) {
      jsonOutput.value = "[]";
      return;
    }

    let delim = delimiterSelect.value;
    if (delim === "auto") {
      const firstLine = text.split("\n")[0];
      if (firstLine.includes("\t")) delim = "\t";
      else if (firstLine.includes(";")) delim = ";";
      else if (firstLine.includes("|")) delim = "|";
      else delim = ",";
    }

    const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
    if (lines.length === 0) {
      jsonOutput.value = "[]";
      return;
    }

    try {
      const parsedRows = lines.map(line => parseCSVLine(line, delim));
      let result;

      if (hasHeaderCheckbox.checked && parsedRows.length > 1) {
        const headers = parsedRows[0].map(h => h.trim());
        result = parsedRows.slice(1).map(row => {
          let obj = {};
          headers.forEach((h, idx) => {
            obj[h] = parseValue(row[idx] !== undefined ? row[idx] : "");
          });
          return obj;
        });
      } else {
        result = parsedRows.map(row => row.map(parseValue));
      }

      jsonOutput.value = JSON.stringify(result, null, 2);
      showStatus(`✓ Converted ${lines.length} line(s) successfully!`, "success");
    } catch (err) {
      showStatus("✗ Error parsing CSV: " + err.message, "error");
    }
  };

  convertBtn.addEventListener("click", convert);
  copyBtn.addEventListener("click", async () => {
    if (!jsonOutput.value) return;
    await navigator.clipboard.writeText(jsonOutput.value);
    showStatus("✓ JSON copied to clipboard!", "success");
  });
  downloadBtn.addEventListener("click", () => {
    if (!jsonOutput.value) return;
    const blob = new Blob([jsonOutput.value], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "data.json";
    a.click();
    URL.revokeObjectURL(url);
  });
  clearBtn.addEventListener("click", () => {
    csvInput.value = "";
    jsonOutput.value = "";
    status.classList.add("hidden");
  });

  convert();
});
</script>  </div> <!-- Back to utilities --> <div class="mt-8 text-center"> <a href="/utilities" class="inline-flex items-center gap-2 px-6 py-3 bg-gray-700 hover:bg-gray-600 rounded-lg transition-colors">← Browse More Utilities</a> </div> </div> </div>  </main> </body></html>
